name: ScienceDiscovery coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/science-coverage.yml"
      - "coverage/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sciencediscovery-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out status-board collector
        uses: actions/checkout@v4

      - name: Resolve ScienceDiscovery main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/openJiuwen-ai/sciencediscovery.git refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=sciencediscovery-coverage-$sha" >> "$GITHUB_OUTPUT"

      - name: Check for an existing unexpired report
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact }}
        run: |
          set -euo pipefail
          count="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$count" -gt 0 ]; then
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "Coverage already exists for ${{ steps.source.outputs.sha }}."
          else
            echo "collect=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ScienceDiscovery
        if: steps.existing.outputs.collect == 'true'
        uses: actions/checkout@v4
        with:
          repository: openJiuwen-ai/sciencediscovery
          ref: ${{ steps.source.outputs.sha }}
          path: target

      - name: Set up pnpm
        if: steps.existing.outputs.collect == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Set up Node
        if: steps.existing.outputs.collect == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Set up uv
        if: steps.existing.outputs.collect == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Provision the sandbox
        if: steps.existing.outputs.collect == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true

      - name: Prepare and build ScienceDiscovery
        if: steps.existing.outputs.collect == 'true'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          uv sync --project services/gateway
          uv sync --project services/paper --locked
          pnpm build

      - name: Collect Node coverage
        if: steps.existing.outputs.collect == 'true'
        continue-on-error: true
        env:
          SCIENCEDISCOVERY_REPOSITORY: openJiuwen-ai/sciencediscovery
          SCIENCEDISCOVERY_SHA: ${{ steps.source.outputs.sha }}
        run: node coverage/collect.mjs target coverage-output

      - name: Upload coverage report
        if: always() && steps.existing.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: coverage-output
          if-no-files-found: error
          retention-days: 30
