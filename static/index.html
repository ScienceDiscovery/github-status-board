<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 状态看板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-title">GitHub 状态看板</span>
    <a id="repo-link" class="repo-link" href="#" target="_blank" rel="noopener">—</a>
  </div>
  <div class="meta" id="meta">载入中…</div>
  <div class="actions">
    <button id="refresh-btn" class="btn primary" type="button">刷新</button>
  </div>
</header>

<div id="global-banner" class="banner hidden"></div>

<nav class="tabs" id="tabs">
  <a href="#overview" data-tab="overview">总览</a>
  <a href="#board" data-tab="board">看板</a>
  <a href="#issues" data-tab="issues">Issue</a>
  <a href="#prs" data-tab="prs">PR</a>
  <a href="#ci" data-tab="ci">CI</a>
  <a href="#tests" data-tab="tests">测试</a>
  <a href="#coverage" data-tab="coverage">Coverage</a>
  <a href="#ops" data-tab="ops">运维</a>
</nav>

<main id="main">
  <section id="tab-overview" class="tab"></section>
  <section id="tab-board" class="tab"></section>
  <section id="tab-issues" class="tab"></section>
  <section id="tab-prs" class="tab"></section>
  <section id="tab-ci" class="tab"></section>
  <section id="tab-tests" class="tab"></section>
  <section id="tab-coverage" class="tab"></section>
  <section id="tab-ops" class="tab"></section>
</main>

<footer class="foot">
  <span>本地看板 · 只读 · 数据来自 GitHub REST/GraphQL 与 Actions 产物</span>
  <span id="foot-rate"></span>
</footer>

<aside id="drawer" class="drawer hidden" aria-label="卡片详情"></aside>
<dialog id="board-settings" class="settings"></dialog>
<div id="tooltip" class="tooltip hidden"></div>
<script src="/static/app.js"></script>
<script src="/static/board.js"></script>
</body>
</html>
